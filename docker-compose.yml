# Local development: PostgreSQL + Redis (run the API with `npm run dev`).
#   docker compose up -d
# With the ML anomaly detector (reads ./logs written by the API, dashboard on http://localhost:8000):
#   docker compose --profile monitoring up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ML anomaly detector (monitoring/ml-detector). Reads the API's JSON logs from ./logs (read-only),
  # keeps trained models in ./models. Telegram settings come from .env.
  ml-detector:
    build: ./monitoring/ml-detector
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DETECTOR_PROFILE: pos
      LOG_DIR: /logs
      MODEL_DIR: /models
      LIVE_INTERVAL: "10"
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFY_METHODS: ${NOTIFY_METHODS:-}
      NOTIFY_RESOLVE_AFTER_S: ${NOTIFY_RESOLVE_AFTER_S:-60}
      NOTIFY_MIN_WINDOWS: ${NOTIFY_MIN_WINDOWS:-}
      NOTIFY_TIMEZONE: ${NOTIFY_TIMEZONE:-UTC}
    volumes:
      - ./logs:/logs:ro
      - ./models:/models
    ports:
      - "127.0.0.1:8000:8000"   # development only; production does not publish it
    mem_limit: 1536m

volumes:
  pgdata:
  redisdata:
