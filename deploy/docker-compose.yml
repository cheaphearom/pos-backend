# Production: database, cache, API, Cloudflare Tunnel, nightly backups and the ML anomaly detector.
# The web app is hosted separately (pos-frontend on Cloudflare Workers) and calls this API.
#   cd deploy && cp .env.example .env   (fill it in)
#   docker compose up -d --build
# Nothing is opened to the internet: Cloudflare Tunnel connects out to Cloudflare.
# The ML detector is turned on with COMPOSE_PROFILES=tunnel,monitoring (deploy/.env).
name: pos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Times are stored in UTC; reports use REPORT_TIMEZONE.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pos}?schema=public
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # JSON logs for the ML detector: deploy/logs on the server (rotated daily / at LOG_MAX_MB)
      LOG_DIR: /app/logs
      # The monitoring endpoints reach the detector over the internal network only
      DETECTOR_URL: http://ml-detector:8000
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Only reachable from this computer (for checking); the public way in is the tunnel.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  # ML anomaly detector: reads the API's logs (read-only), keeps its models in deploy/models.
  # No port is published: only the API reaches it (http://ml-detector:8000), never the internet.
  ml-detector:
    build:
      context: ../monitoring/ml-detector
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DETECTOR_PROFILE: pos
      LOG_DIR: /logs
      MODEL_DIR: /models
      LIVE_INTERVAL: "10"
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFY_METHODS: ${NOTIFY_METHODS:-}
      NOTIFY_RESOLVE_AFTER_S: ${NOTIFY_RESOLVE_AFTER_S:-60}
      TZ: UTC
    volumes:
      - ./logs:/logs:ro
      - ./models:/models
    # Training one day of logs needs about 600 MB on top of the live loop (~200 MB).
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    profiles: ["tunnel"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh", "loop"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Phnom_Penh}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: copy the backups to Cloudflare R2 every hour (add "r2" to COMPOSE_PROFILES).
  backup-r2:
    image: rclone/rclone:1.68
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do rclone copy /backups r2:$${R2_BUCKET}/pos-backups --include 'pos-*.sql.gz' && echo '[r2] backups copied'; sleep 3600; done"]
    environment:
      R2_BUCKET: ${R2_BUCKET:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:-none}.r2.cloudflarestorage.com
    volumes:
      - ./backups:/backups:ro
    profiles: ["r2"]

volumes:
  pgdata:
  redisdata:
